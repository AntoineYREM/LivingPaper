<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Average grade before and after the change of prompt</title>
  <desc id="desc">DeepSeek V4.1 Flash: 4.35 before, 4.92 after; Claude Opus 5.5: 4.08 before, 4.90 after; GPT-5 mini: 3.58 before, 4.50 after; DeepSeek V4.1 Flash · Cyrano: 4.28 before, 4.73 after</desc>
