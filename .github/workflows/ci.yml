name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes the image.
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned, not "ubuntu-latest": that label moved to Ubuntu 26.04, which Playwright does not support (no Chromium), so the
    # end-to-end tests could not start. Move to a newer image when Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LivingPaper.sln

      - name: Build
        run: dotnet build LivingPaper.sln --no-restore --configuration Release

      # Unit, integration and end-to-end tests. The end-to-end tests (tests/LivingPaper.E2ETests) drive a real Chromium against
      # the application and a fake language model; they install Chromium and its system libraries themselves (CI=true).
      - name: Test
        run: dotnet test LivingPaper.sln --no-build --configuration Release
        env:
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts

      # A screenshot and a trace (open with `playwright show-trace`) of every end-to-end test that failed.
      - name: Keep the screenshots and traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      # Dependencies must have a license that can be combined with the AGPL-3.0 (see THIRD-PARTY-NOTICES.md).
      - name: Check dependency licenses
        run: python3 .github/scripts/check-licenses.py

      # The image must build: it is how most people run the application.
      - name: Build the Docker image
        run: docker build --tag livingpaper:ci .

