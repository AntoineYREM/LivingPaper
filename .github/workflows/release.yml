name: Release

# Pushing a tag such as v0.1.0 publishes the Docker image to GitHub Container Registry (GHCR).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published unless the build and every test pass.
  test:
    uses: ./.github/workflows/ci.yml

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the GITHUB_TOKEN: no secret is stored
    steps:
      - uses: actions/checkout@v4

      # QEMU and Buildx build the arm64 variant (Apple Silicon, Raspberry Pi) on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the tag v0.1.0: 0.1.0, 0.1 and latest, and the label org.opencontainers.image.version=0.1.0.
      # The image name is the repository name in lower case, as GHCR requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
